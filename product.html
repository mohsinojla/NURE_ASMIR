<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Product | Nure Asmir</title>
  <meta name="theme-color" content="#f0e6dc">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230c0a07'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='34' text-anchor='middle' fill='%23f0e6dc'%3ENA%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/styles.css">
  <script>document.documentElement.classList.add("js");</script>
  <script src="js/data.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body data-page="product">
<main id="main">
  <div class="container">
    <nav class="crumbs" id="crumbs" aria-label="Breadcrumb" style="padding-top:20px"></nav>

    <div class="pdp">
      <div class="pdp__gallery">
        <div class="gal"><div class="gal__track" id="track"></div><div class="gal__dots" id="dots" aria-hidden="true"></div></div>
        <div class="pdp__stack" id="stack"></div>
      </div>

      <div class="pdp__info">
        <div style="display:grid;gap:12px">
          <span class="eyebrow eyebrow--accent" id="pTag"></span>
          <h1 class="pdp__title" id="pTitle"></h1>
          <div class="pdp__price" id="pPrice"></div>
        </div>
        <p class="lead" id="pBlurb" style="font-size:19px"></p>

        <div>
          <div class="opt__label"><span>Colour</span><span id="colourName"></span></div>
          <div class="swatches" id="swatches"></div>
        </div>
        <div>
          <div class="opt__label"><span>Size &nbsp;<span id="sizeName" style="letter-spacing:.1em">Select</span></span><button type="button" onclick="document.querySelector('#acc details:nth-child(3)').open=true">Delivery info</button></div>
          <div class="sizes" id="sizes" role="group" aria-label="Size"></div>
        </div>

        <div class="pdp__buy">
          <button class="btn btn--primary" id="add" type="button">Add to bag</button>
          <button class="pdp__fav" id="pFav" type="button" aria-pressed="false" aria-label="Save to your list"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"/></svg></button>
        </div>
        <p class="ph-note" id="phNote" hidden>Photography for this piece is in production. Design and price shown are preview values.</p>

        <div class="assure">
          <div><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 6h11v10H2zM13 9h4l3 3v4h-7"/><circle cx="7" cy="17.5" r="1.6"/><circle cx="17" cy="17.5" r="1.6"/></svg>Complimentary delivery above Rs. 15,000</div>
          <div><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h11a5 5 0 1 1 0 10H8"/><path d="M8 5 4 9l4 4"/></svg>14-day returns on unworn pieces</div>
          <div><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20 20 4M6 14l4 4M12 8l4 4"/></svg>Hand-finished details, inspected in the atelier</div>
        </div>
        <div id="acc"></div>
      </div>
    </div>
  </div>

  <section class="section surface-raised">
    <div class="container">
      <div class="sec-head"><div><span class="eyebrow eyebrow--accent">Complete the look</span><h2 class="h2" style="margin-top:12px">You may <em>also like</em></h2></div></div>
      <div class="pgrid" id="related"></div>
    </div>
  </section>
</main>
</body>
</html>
